<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strona Główna | Ekskluzywna Restauracja</title>
    <link rel="stylesheet" href="tmpCss.css" />
  </head>
  <body>

    <!-- Główny baner powitalny (Hero Section) -->
    <header class="hero">
      <div class="shell hero-content">
        
        <!-- Miejsce na nagłówek wstrzykiwany przez JavaScript -->
        <div id="hednav"></div>

        <p class="eyebrow light">Zapraszamy</p>
        <h1>Tradycja spotyka <em>nowoczesność</em></h1>
        <p class="hero-copy">Odkryj unikalne smaki komponowane z lokalnych, świeżych składników przez naszych mistrzów kuchni.</p>

        <!-- KAFLE NAWIGACYJNE: Ułożone pionowo, dosunięte do lewej -->
        <div class="hero-actions">
          
          <!-- Kafel 1: Menu -->
          <a href="menu.html" class="hero-action menu-action">
            <span>
              <small>Nasze specjały</small>
              Otwórz Menu
            </span>
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>

          <!-- Kafel 2: Rezerwacje -->
          <a href="reservation.html" class="hero-action reserve-action">
            <span>
              <small>Wolisz na miejscu?</small>
              Rezerwuj stolik
            </span>
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>

        </div>
      </div>
      
      <!-- Dolna belka informacyjna -->
      <div class="shell hero-foot">
        <span class="scroll-cue"></span>
        <span></span>
      </div>
    </header>

    <script src="nav.js"></script>
  </body>
</html>
